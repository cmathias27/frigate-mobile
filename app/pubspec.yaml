name: frigate_mobile
description: "Application mobile pour Frigate NVR."
publish_to: 'none'

# Version shown in the app and compared by the in-app update (decision 0003).
version: 0.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.3
  gal: ^3.0.1
  http: ^1.6.0
  intl: any
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Release notes of every version, shown in the app (decision 0003).
  assets:
    - assets/CHANGELOG.md
